name: CI

on:
  pull_request:
    branches: ['main', 'develop']
    types: [opened, synchronize, reopened]
  push:
    branches: ['main', 'develop']

jobs:
  validate:
    name: Validate PR (Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting

        run: npx prettier --check .

      # embedded-postgres ships no types; test/embedded-postgres.d.ts is
      # maintained by hand against a beta range. Fail the build if the pinned
      # dependency and the declarations drift apart (issue #673).
      - name: Verify embedded-postgres type declarations are in sync
        run: npm run check:embedded-postgres-types

      - name: Linting
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Build Verification
        run: npm run build
